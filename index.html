'एक्काहत्तर,बाहत्तर,त्र्याहत्तर,चौर्‍याहत्तर,पंच्याहत्तर,शहात्तर,सत्याहत्तर,अठ्ठ्याहत्तर,एकोणऐंशी,ऐंशी,एक्क्याऐंशी,ब्याऐंशी,त्र्याऐंशी,चौऱ्याऐंशी,पंच्याऐंशी,शहाऐंशी,सत्त्याऐंशी,अठ्ठ्याऐंशी,एकोणनव्वद,नव्वद,एक्क्याण्णव,ब्याण्णव,त्र्याण्णव,चौऱ्याण्णव,पंच्याण्णव,शहाण्णव,सत्त्याण्णव,अठ्ठ्याण्णव,नव्व्याण्णव,शंभर').split(',');

/* ---------- audio ---------- */
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,g){const a=ac();if(!a)return;const o=a.createOscillator(),n=a.createGain(),t=a.currentTime+t0;o.type=type||'triangle';o.frequency.value=f;
 n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(g||.25,t+.02);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function pop(){const a=ac();if(!a)return;const b=a.createBuffer(1,3000,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)*.5;const s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start()}

 h+='</select><select onchange="setPitch(this.value)">';[['1','Normal'],['1.2','👦 Boy'],['1.4','👦 Boy+']].forEach(p=>h+=`<option value="${p[0]}"${+c.p===+p[0]?' selected':''}>${p[1]}</option>`);return h+'</select>'}

function testVoice(){const v=voices.find(x=>x.name===S.vc.n),l=v?String(v.lang).replace('_','-'):'mr-IN',k=l.slice(0,2);speakOnce(k==='en'?'Hello '+S.pf.n+', well done!':k==='hi'?'नमस्ते '+S.pf.n+', शाबाश!':'नमस्कार '+S.pf.n+', शाब्बास!',l)}
function pickVoice(l){const pre=l.slice(0,2).toLowerCase();let best=null,v;
 if(S.vc.n){v=voices.find(x=>x.name===S.vc.n&&String(x.lang).slice(0,2).toLowerCase()===pre);if(v)return v}
 for(const x of voices){const g=String(x.lang).replace('_','-').toLowerCase();if(g===l.toLowerCase())return x;if(g.indexOf(pre)===0&&!best)best=x}

function sp(st){const t=st[0],a=st.slice(1);
 if(t==='p'){const o=[];for(let i=0;i+3<a.length;i+=2){const x0=a[i],y0=a[i+1],x1=a[i+2],y1=a[i+3],n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/1.2));for(let k=i?1:0;k<=n;k++)o.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n])}return[o]}
 if(t==='c'||t==='a'){const[cx,cy,r,a0,a1]=t==='c'?[a[0],a[1],a[2],0,360]:a,n=Math.max(8,Math.round(r*Math.abs(a1-a0)*Math.PI/180/1.2)),o=[];for(let k=0;k<=n;k++){const g=(a0+(a1-a0)*k/n)*Math.PI/180;o.push([cx+r*Math.cos(g),cy+r*Math.sin(g)])}return[o]}
 if(t==='r'){const[cx,cy,r1,r2,n]=a,res=[];for(let k=0;k<n;k++){const g=2*Math.PI*k/n,c=Math.cos(g),s=Math.sin(g);res.push(sp(['p',cx+r1*c,cy+r1*s,cx+r2*c,cy+r2*s])[0])}return res}
 if(t==='o'){const[cx,cy,R,rp,n]=a;let res=[];for(let k=0;k<n;k++){const g=2*Math.PI*k/n-Math.PI/2;res=res.concat(sp(['c',cx+R*Math.cos(g),cy+R*Math.sin(g),rp]))}return res}
 return[]}
function drawHTML(){if(!D.done)return '<div class="card">🔒 आधी आजचं टार्गेट पूर्ण करा!</div>';const dr=DR[mod(doneCount()-1,DR.length)];
 return `<div class="card cta">🎁 बक्षीस: ${dr.n} काढायला शिका!</div><div class="card"><canvas id="dcv" class="wc"></canvas><div id="dcap" class="ok" style="font-size:20px;min-height:34px"></div><button class="btn b" onclick="dPlay()">▶ पुन्हा पाहा</button><button class="btn w spd" onclick="spd()">🐢 ${SP===1?'Normal':'Slow 0.5x'}</button><div class="hint">🖍 आता वहीत हेच चित्र काढा!</div></div>`}
function dPlay(){const cv=$('dcv');if(!cv)return;const dr=DR[mod(doneCount()-1,DR.length)],dpr=Math.min(2,window.devicePixelRatio||1),cw=Math.min(cv.parentNode.clientWidth-30,360);
 cv.width=cv.height=Math.round(cw*dpr);cv.style.height=cw+'px';cv.style.width=cw+'px';const sc=cv.width/100,c=cv.getContext('2d'),all=[];
 dr.s.forEach((st,si)=>st[1].forEach(s=>sp(s).forEach(pl=>pl.forEach((p,k)=>all.push({x:p[0]*sc,y:p[1]*sc,l:k===0,s:si})))));
 stopAnim();const tok=AN={};let i=0,pause=.4,acc=0,last=0,cs=-1,lf=false;
 (function step(ts){if(AN!==tok)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  if(pause>0)pause-=dt;else{acc+=28*SP*dt;let n=Math.floor(acc);acc-=n;
   while(n-->0&&i<all.length){const p=all[i];if(p.s!==cs){cs=p.s;$('dcap').textContent=dr.s[cs][0];pause=.9;break}if(p.l&&i>0&&!lf){lf=true;pause=.25;break}lf=false;i++}}
  c.clearRect(0,0,cv.width,cv.height);c.lineWidth=3*dpr;c.lineCap=c.lineJoin='round';c.strokeStyle=dr.c;c.beginPath();
  for(let k=0;k<i;k++){const p=all[k];if(p.l||k===0)c.moveTo(p.x,p.y);else c.lineTo(p.x,p.y)}c.stroke();
  if(i>=all.length){AN=null;$('dcap').textContent='✅ तयार! आता वहीत काढा 🖍';return}
  if(i>0)drawPen(c,all[i-1].x,all[i-1].y,dpr);requestAnimationFrame(step)})(0)}

/* ---------- celebration ---------- */
let ccv,ccx,parts=[],celOn=0,endAt=0,bt=0;const COL=['#FFC93C','#FF5D5D','#2BB673','#5C7CFF','#FF7AC6','#fff'],rcol=()=>COL[Math.floor(Math.random()*COL.length)];
function celebrate(sub){$('cel').hidden=false;ccv=$('cv');ccv.width=innerWidth;ccv.height=innerHeight;ccx=ccv.getContext('2d');parts=[];celOn=1;endAt=Date.now()+7000;bt=0;
 $('bnTxt').innerHTML='🎉 शाब्बास '+esc(S.pf.n)+'!<br>आजचं टार्गेट पूर्ण झालं!<br>You are a champion! 🏆';$('bnSub').innerHTML=sub;
 try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch(e){}fanfare();loop()}
function closeCel(go){celOn=0;$('cel').hidden=true;tab=go?'draw':'home';renderStudent()}
function burst(x,y){const c=rcol();for(let i=0;i<40;i++){const a=6.283*i/40,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:55+Math.random()*30,c,s:3,g:.07})}pop()}
function loop(){if(!celOn)return;const now=Date.now();ccx.clearRect(0,0,ccv.width,ccv.height);
 if(now<endAt){if(now-bt>450){bt=now;burst(ccv.width*(.1+Math.random()*.8),ccv.height*(.1+Math.random()*.4))}parts.push({x:Math.random()*ccv.width,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*2,l:240,c:rcol(),s:8,g:0})}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;if(p.l<=0||p.y>ccv.height+20){parts.splice(i,1);continue}ccx.fillStyle=p.c;ccx.fillRect(p.x,p.y,p.s,p.s)}
 if(now<endAt||parts.length)requestAnimationFrame(loop)}

function approve(v){getD(adDate).ok=v?1:0;save();$('amsg').innerHTML=v?'<span class="ok">⭐ Verified '+adDate+'</span>':'Verification removed'}
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function pdfPages(file){const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';if(!window.pdfjsLib){await loadScript(B+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js'}
 const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
 for(let i=1;i<=Math.min(doc.numPages,8);i++){const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(2,760/v0.width)}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;out.push(c.toDataURL('image/jpeg',.55))}return out}
function imgPage(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,760/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.55))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function upLesson(f){const fl=Array.from(f.files);if(!fl.length)return;$('lst').textContent='⏳ तयार होत आहे...';let pages=[];
 try{for(const file of fl)pages=pages.concat(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)?await pdfPages(file):[await imgPage(file)])}
 catch(e){$('lst').textContent='❌ PDF वाचता आला नाही (इंटरनेट हवं). पुस्तकाचे फोटो निवडून पाहा.';return}
 LSdraft=pages.slice(0,8);$('lpv').innerHTML=LSdraft.map(p=>`<img class="pic" style="max-height:140px" src="${p}" alt="">`).join('');$('lst').textContent='✅ '+LSdraft.length+' पाने तयार — Save दाबा'}

function report(){const keys=Object.keys(S.days).sort();let ok=0,rows='',tw=0,tt=0,tl=0;

 window.print()}
