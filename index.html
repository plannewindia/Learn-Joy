async function playWeaponAction() {
  const p = S.avatar.prop;
  const el = $('avatar'), r = el.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  const dx = W / 2 - (r.left + r.width / 2), dy = H * .32 - (r.top + r.height / 2), sc = 2.8;
  const T = (x, y, s) => 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';

  //   
  el.style.zIndex = 70;
  const jump = el.animate([
    { transform: T(0, 0, 1) },
    { transform: T(dx, dy - 40, sc), offset: 0.7 },
    { transform: T(dx, dy, sc) }
  ], { duration: 900, easing: 'ease-out', fill: 'forwards' });
  await jump.finished;

  //     
  if (p === 'sword') {
    drawAvatar('anim-slash');
    playWeaponSound('sword');
    await sleep(400); playWeaponSound('sword');
    await sleep(400); playWeaponSound('sword');
  } else if (p === 'spear') {
    drawAvatar('anim-thrust');
    playWeaponSound('spear');
    await sleep(350); playWeaponSound('spear');
    await sleep(350); playWeaponSound('spear');
  } else if (p === 'shield') {
    drawAvatar('anim-block');
    playWeaponSound('shield');
    await sleep(500); playWeaponSound('shield');
  } else if (p === 'bow') {
    drawAvatar('anim-shoot');
    playWeaponSound('bow');
    await sleep(400); playWeaponSound('bow');
    await sleep(400); playWeaponSound('bow');
  } else {
    drawAvatar();
    hop();
  }

  await sleep(1400);
  drawAvatar(); //  

  //     
  const back = el.animate([
    { transform: T(dx, dy, sc) },
    { transform: T(0, 0, 1) }
  ], { duration: 800, easing: 'ease-in', fill: 'forwards' });
  await back.finished;
  jump.cancel(); back.cancel();
  el.style.zIndex = '';
}

    '<div class="meaning"> / Meaning: ' + others + '</div><div class="row"><button class="btn b" onclick="say(\'w\')"> </button><button class="btn mic" id="micW" onclick="micWord()">  </button>' + (SR ? '' : '<button class="btn w" onclick="passStep(\'a\')">  </button>') + '</div><div id="fbW" class="fb"></div></div>';
  h += '<div class="card' + (st.b ? ' pass' : '') + '"><div class="lang">) ' + L.n + '    ' + (st.b ? '<span class="tick"></span>' : '') + '</div><div class="sent" id="sentBox">' +
    words.map((t, i) => '<span class="w' + (st.b ? ' ok' : '') + '" id="t' + i + '">' + esc(t) + '</span>').join(' ') + '</div>' +
    '<div class="row"><button class="btn b" onclick="say(\'s\')"> </button><button class="btn mic" id="micS" onclick="micSent()"' + (st.a || !SR ? '' : ' disabled') + '>  </button>' + (SR ? '' : '<button class="btn w" onclick="passStep(\'b\')">  </button>') + '</div>' +
    '<div class="hint" style="font-size:14px;color:#555">' + (st.a ? '    .' : '   ,  .') + '</div><div id="fbS" class="fb"></div></div>';
  h += '<div class="row"><button class="btn w" onclick="openInv()">   </button><button class="btn w" onclick="openSettings()"> </button><button class="btn w" onclick="greet()"> , !</button></div>';
  $('app').innerHTML = h; updStats();
}
function say(w) { const L = LG[cur.lg]; speakText(w === 'w' ? todayWords()[L.k] : todaySents()[L.k], L.sr, .85); }

function micWord() {
  if (!SR) return noSR();
  if (micOn === 'W') { stopRec(); micState(); return; }
  const L = LG[cur.lg], w = todayWords()[L.k]; let ok = false, err = '';
  micState('W'); fbSet('fbW', ' ', '');
  startRec(L.sr, false, all => {
    fbSet('fbW', ': ' + all.map(r => r.alts[0]).join(' '), '');
    if (!ok && all.some(r => r.alts.some(a => wordMatch(a, w)))) { ok = true; stopRec(); micState(); passStep('a'); }
  }, () => { micState(); if (!ok && !err) fbSet('fbW', '     "' + w + '"  ', 'no'); },
  m => { err = m; micState(); fbSet('fbW', m, 'no'); });
}
function micSent() {
  if (!SR) return noSR();
  const L = LG[cur.lg], words = todaySents()[L.k].split(/\s+/), nw = words.map(norm), n = nw.length;
  if (micOn === 'S') { stopRec(); micState(); evalSent(lastTr || { m: [], p: 0 }, n); return; }
  let ok = false, err = ''; lastTr = { m: new Array(n).fill(0), p: 0 };
  paintSent(lastTr, n); micState('S'); fbSet('fbS', '  ', '');
  startRec(L.sr, true, all => {
    lastTr = track(norm(all.map(r => r.alts[0]).join(' ')).split(' ').filter(Boolean), nw);
    paintSent(lastTr, n);
    if (!ok && lastTr.p >= n) { ok = true; stopRec(); micState(); evalSent(lastTr, n); }
  }, () => { micState(); if (!ok && !err) { ok = true; evalSent(lastTr, n); } },
  m => { err = m; micState(); fbSet('fbS', m, 'no'); });
}
function evalSent(tr, n) {
  const good = tr.m.filter(x => x === 1).length;
  if (good / n >= .7) passStep('b');
  else { paintSent(tr, n); fbSet('fbS', ' ' + good + '/' + n + '     ', 'no'); }
}

function passStep(which) {
  const D = getDay(), k = LG[cur.lg].k;
  if (!D.w[k][which]) { D.w[k][which] = 1; S.xp += which === 'a' ? 10 : 15; save(); }
  chime(); hop(); render();
  fbSet(which === 'a' ? 'fbW' : 'fbS', ' ! !', 'ok');
  if (LG.every(g => D.w[g.k].a && D.w[g.k].b)) { if (!D.done) setTimeout(completeDay, 700); return; }
  if (D.w[k].a && D.w[k].b) { const nx = LG.findIndex(g => !(D.w[g.k].a && D.w[g.k].b)); if (nx >= 0) setTimeout(() => { cur.lg = nx; render(); }, 1400); }
}

function completeDay() {
  const D = getDay(), t = today(); if (D.done) return;
  D.done = 1; S.xp += 50;
  S.streak = S.last === addDays(t, -1) ? S.streak + 1 : (S.last === t ? S.streak : 1); S.last = t; if (S.streak > S.best) S.best = S.streak;
  const key = todayWords().en; if (S.completed.indexOf(key) < 0) S.completed.push(key);
  save(); render(); celebrate();
}

/* ----------     ---------- */
let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(f, t0, d, type, g) { const a = ac(); if (!a) return; const o = a.createOscillator(), n = a.createGain(), t = a.currentTime + t0; o.type = type || 'triangle'; o.frequency.value = f; n.gain.setValueAtTime(.0001, t); n.gain.exponentialRampToValueAtTime(g || .22, t + .02); n.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(n); n.connect(a.destination); o.start(t); o.stop(t + d + .05); }
const chime = () => { tone(660, 0, .16); tone(880, .14, .28); };
const fanfare = () => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .16, .28, 'square', .14)); tone(1568, 1.2, .9, 'triangle', .2); };

function playWeaponSound(type) {
  const a = ac(); if (!a) return;
  if (type === 'sword') {
    //    (Swoosh)
    tone(900, 0, 0.15, 'sine', 0.3);
    tone(400, 0.05, 0.2, 'triangle', 0.25);
  } else if (type === 'spear') {
    //   (Heavy thrust)
    tone(220, 0, 0.25, 'sawtooth', 0.3);
    tone(600, 0.08, 0.15, 'sine', 0.2);
  } else if (type === 'shield') {
    //   (Metal clank)
    tone(450, 0, 0.3, 'square', 0.2);
    tone(300, 0.05, 0.4, 'triangle', 0.25);
  } else if (type === 'bow') {
    //    (Whistle + Twang)
    tone(350, 0, 0.08, 'sawtooth', 0.25);
    tone(850, 0.06, 0.25, 'sine', 0.3);
  }
}

let cfOn = 0, parts = [], endAt = 0, bt = 0;
const COL = ['#FFC93C', '#FF5D5D', '#2BB673', '#5C7CFF', '#FF7AC6', '#ffffff'], rcol = () => COL[Math.floor(Math.random() * COL.length)];

async function celebrate() {
  const c = $('cf'); c.width = innerWidth; c.height = innerHeight; parts = []; cfOn = 1; endAt = Date.now() + 6500; bt = 0;
  fanfare();
  loop();

  //     
  await playWeaponAction();

  const weaponName = (ITEMS.prop.find(x => x[0] === S.avatar.prop) || [])[1] || '';
  const b = document.createElement('div'); b.className = 'banner'; b.id = 'bn';
  b.innerHTML = '  ' + esc(S.name || '') + '!<br>   !<br><div style="font-size:18px;color:#D84315;margin:8px 0"> ' + weaponName + '  ! </div><div style="font-size:17px;margin:8px 0">+50  &nbsp;  ' + S.streak + ' </div><button class="btn g" onclick="this.parentNode.remove();openInv()">  </button> <button class="btn w" onclick="this.parentNode.remove()"> </button>';
  document.body.appendChild(b);
}

function burst(x, y) { const c = rcol(); for (let i = 0; i < 40; i++) { const a = 6.283 * i / 40, v = 2 + Math.random() * 4; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 55 + Math.random() * 30, c, s: 3, g: .07 }); } }
function loop() {
  const c = $('cf'), x = c.getContext('2d'), now = Date.now(); x.clearRect(0, 0, c.width, c.height);
  if (cfOn && now < endAt) { if (now - bt > 450) { bt = now; burst(c.width * (.1 + Math.random() * .8), c.height * (.1 + Math.random() * .4)); } parts.push({ x: Math.random() * c.width, y: -10, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 2, l: 240, c: rcol(), s: 8, g: 0 }); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.l--; if (p.l <= 0 || p.y > c.height + 20) { parts.splice(i, 1); continue; } x.fillStyle = p.c; x.fillRect(p.x, p.y, p.s, p.s); }
  if ((cfOn && now < endAt) || parts.length) requestAnimationFrame(loop); else cfOn = 0;
}

function openSettings(first) {
  const cl = { off:' Firebase   (   )', ok:'   ', sync:'   ', err:' Firebase   ' }[cloud];
  $('sheet').innerHTML = '<b style="font-size:20px"> </b>' + (first ? '<div class="warn">   .</div>' : '') +
    ' / Name<input id="sn" value="' + esc(S.name) + '" placeholder=". "> / Class<select id="sc2">' + Array.from({ length: 10 }, (_, i) => '<option value="' + (i + 1) + '"' + (+S.cls === i + 1 ? ' selected' : '') + '> ' + (i + 1) + '</option>').join('') + '</select>' +
    '<button class="btn g" style="width:100%;margin-top:8px" onclick="saveSettings()"> Save</button><hr><div class="fb">' + cl + '</div>' +
    '<div class="row"><button class="btn b" onclick="fbGoogle()">Google  -</button><button class="btn w" onclick="fbPush()">  </button></div>' +
    '<div class="row"><button class="btn r" onclick="resetAll()">  </button><button class="btn w" onclick="closeModal()"></button></div>';
  $('modal').hidden = false;
}
function saveSettings() { S.name = $('sn').value.trim() || ''; S.cls = +$('sc2').value; const first = !S.setup; S.setup = true; save(); closeModal(); render(); if (first) setTimeout(greet, 400); }
function resetAll() { if (confirm('   ?')) { localStorage.removeItem(KEY); load(); save(); drawAvatar(); closeModal(); render(); } }

/* ---------- Firebase  ---------- */
function setCloud(c) { cloud = c; $('cl').textContent = { off:' ', ok:' ', sync:' ', err:' ' }[c]; }
function scheduleSync() { if (!fb || !fb.uid) return; clearTimeout(syncT); syncT = setTimeout(fbPush, 1500); }
async function fbInit() {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') { setCloud('off'); return; }
  try {
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VERSION + '/';
    const [A, F, U] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = A.initializeApp(firebaseConfig), auth = U.getAuth(app); let db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch (e) { db = F.getFirestore(app); }
    fb = { auth, db, doc: F.doc, getDoc: F.getDoc, setDoc: F.setDoc, U, uid: null };
    await new Promise(res => U.onAuthStateChanged(auth, u => { if (u) { fb.uid = u.uid; res(); } else U.signInAnonymously(auth).catch(res); }));
    if (!fb.uid) { setCloud('err'); return; }
    await fbPull(); setCloud('ok'); drawAvatar(); render();
  } catch (e) { setCloud('err'); }
}
async function fbPush() {
  if (!fb || !fb.uid) return;
  try { setCloud('sync'); await fb.setDoc(fb.doc(fb.db, 'children', fb.uid), { data: JSON.stringify(S), updatedAt: S.updatedAt, name: S.name || '', streak: S.streak, xp: S.xp }, { merge: true }); setCloud('ok'); }
  catch (e) { setCloud('err'); }
}
async function fbPull() {
  const snap = await fb.getDoc(fb.doc(fb.db, 'children', fb.uid));
  if (snap.exists()) {
    let rs = null; try { rs = JSON.parse(snap.data().data); } catch (e) {}
    if (rs) {
      S = Object.assign({}, S, rs);
      S.avatar = Object.assign({}, defAv, S.avatar);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }
  }
}
async function fbGoogle() {
  if (!fb) { alert(' firebaseConfig .'); return; }
  try { const r = await fb.U.signInWithPopup(fb.auth, new fb.U.GoogleAuthProvider()); fb.uid = r.user.uid; await fbPull(); setCloud('ok'); drawAvatar(); render(); closeModal(); }
  catch (e) { alert('Google -  : ' + e.message); }
}

load(); drawAvatar(); render(); loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
$('avatar').onclick = openInv;
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
document.addEventListener('touchstart', ac, { once: true });
fbInit();
if (!S.setup) openSettings(true); else window.addEventListener('load', () => setTimeout(greet, 500));
