   Offline-first: everything is saved to localStorage immediately; the cloud copy is synced in the background.
   ===================================================================== */
function setCloud(c) { cloud = c; $('cl').textContent = { off:'☁ ऑफ', ok:'☁ ✔', sync:'☁ …', err:'☁ ⚠' }[c]; $('cl').title = { off:'Firebase not configured', ok:'Backed up', sync:'Syncing', err:'Firebase error' }[c]; }
function scheduleSync() { if (!fb || !fb.uid) return; clearTimeout(syncT); syncT = setTimeout(fbPush, 1500); }
const uni = (a, b) => Array.from(new Set((a || []).concat(b || [])));
const stepsOf = d => d ? LG.reduce((n, g) => n + ((d.w && d.w[g.k]) ? d.w[g.k].a + d.w[g.k].b : 0), 0) + (d.done ? 10 : 0) : -1;
async function fbInit() {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') { setCloud('off'); return; }
  try {
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VERSION + '/';
    const [A, F, U] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = A.initializeApp(firebaseConfig), auth = U.getAuth(app); let db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch (e) { db = F.getFirestore(app); }
    fb = { auth, db, doc: F.doc, getDoc: F.getDoc, setDoc: F.setDoc, U, uid: null };
    await new Promise(res => U.onAuthStateChanged(auth, u => { if (u) { fb.uid = u.uid; res(); } else U.signInAnonymously(auth).catch(res); }));
    if (!fb.uid) { setCloud('err'); return; }
    await fbPull(); setCloud('ok'); drawAvatar(); render();
  } catch (e) { console.warn('Firebase init failed', e); setCloud('err'); }
}
async function fbPush() {
  if (!fb || !fb.uid) { if (!fb) alert('Firebase config भरलेलं नाही / not configured'); return; }
  try { setCloud('sync'); await fb.setDoc(fb.doc(fb.db, 'children', fb.uid), { data: JSON.stringify(S), updatedAt: S.updatedAt, name: S.name || '', streak: S.streak, coins: S.coins, xp: S.xp, wordsDone: S.completed.length }, { merge: true }); setCloud('ok'); }
  catch (e) { console.warn(e); setCloud('err'); }
}
async function fbPull() {
  const snap = await fb.getDoc(fb.doc(fb.db, 'children', fb.uid));
  if (snap.exists()) {
    let rs = null; try { rs = JSON.parse(snap.data().data); } catch (e) {}
    if (rs) {
      const base = (rs.updatedAt || 0) > (S.updatedAt || 0) ? Object.assign({}, S, rs) : S, days = {};
      new Set(Object.keys(S.days).concat(Object.keys(rs.days || {}))).forEach(d => { days[d] = stepsOf(S.days[d]) >= stepsOf((rs.days || {})[d]) ? S.days[d] : rs.days[d]; });
      S = Object.assign({}, base, { days, owned: uni(S.owned, rs.owned), completed: uni(S.completed, rs.completed), xp: Math.max(S.xp, rs.xp || 0), best: Math.max(S.best, rs.best || 0) });
      S.avatar = Object.assign({}, defAv, S.avatar);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }
  }
  await fbPush();
}
async function fbGoogle() {
  if (!fb) { alert('आधी firebaseConfig भरा आणि Firebase मध्ये Google sign-in चालू करा.'); return; }
  try { const r = await fb.U.signInWithPopup(fb.auth, new fb.U.GoogleAuthProvider()); fb.uid = r.user.uid; await fbPull(); setCloud('ok'); drawAvatar(); render(); closeModal(); }
  catch (e) { alert('Google साइन-इन झालं नाही: ' + e.message); }
}
