<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans Devanagari","Noto Sans",system-ui,Roboto,sans-serif;background:linear-gradient(180deg,#FFF3C4,#E8F4FF);color:#1F2A5C;font-size:18px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.tabs{display:flex;gap:6px;margin:6px 0}
.tab{flex:1;min-height:52px;border:3px solid #2D3A8C;border-radius:14px;background:#fff;font-weight:700;font-size:17px;font-family:inherit;color:#2D3A8C;cursor:pointer}
.tab.on{background:#2D3A8C;color:#fff}.tab.dn{border-color:#1FA463}
.card{background:#fff;border:3px solid #2D3A8C;border-radius:18px;padding:14px;margin:10px 0}
.lang{font-size:14px;font-weight:700;color:#5C6BC0}
.big{font-size:46px;font-weight:800;line-height:1.2;word-break:break-word;margin:4px 0}

.mic.rec{background:#E8453C;color:#fff;animation:pulse 1s infinite}

.warn{background:#FFF3CD;border:2px solid #E0A800;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px}
.hint{font-size:14px;color:#555}

.sheet{background:#fff;width:min(100%,640px);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.it{border:3px solid #ccd3f0;border-radius:14px;background:#F7F9FF;padding:6px;text-align:center;font-size:15px;font-weight:700;min-height:90px;cursor:pointer}
.it.sel{border-color:#1FA463;background:#E6F9EE}

.av .it{font-size:13px;min-height:100px}.av .it svg{width:56px;height:56px;border-radius:50%;background:#CFE8FF}
input,select,textarea{width:100%;min-height:50px;font-size:18px;padding:6px 10px;border:3px solid #2D3A8C;border-radius:12px;font-family:inherit;margin:4px 0}
textarea{min-height:80px}
.row input,.row textarea{flex:1 1 220px;width:auto}
#cf{position:fixed;inset:0;pointer-events:none;z-index:80}

</style>

const mod = (a, b) => ((a % b) + b) % b;
// Use the English fallback when a translation is missing.
const txt = (s, en) => { s = String(s || '').trim(); return /[A-Za-z\u0900-\u097F]/.test(s) ? s : en; };

// One flat pool of all words: each entry has its own sentence in every language.

const lvl = () => { const c = +S.cls || 6; return c <= 4 ? 0 : c <= 7 ? 1 : 2; };
const dayNo = () => { const a = today().split('-'), b = S.start.split('-'); return Math.round((Date.UTC(+a[0], +a[1] - 1, +a[2]) - Date.UTC(+b[0], +b[1] - 1, +b[2])) / 864e5) + 1; };

// Default picks: the first few words of the child's level.
function defaultPicks() { return POOL.filter(p => p.lv === lvl()).slice(0, DAILY).map(p => p.en); }

// Today's words: DAILY words taken in rotation from the picked list.
function todayQueue() {
  const P = (S.picked && S.picked.length) ? S.picked : defaultPicks();
  const n = Math.min(DAILY, P.length), st = ((dayNo() - 1) * DAILY) % P.length, out = [];
  for (let i = 0; i < n; i++) { const e = byEn(P[(st + i) % P.length]); if (e) out.push(e); }
  return out;
}

/* ---------- Daily progress: 5 steps per word, per language ---------- */
function getDay() {
  const t = today();
  const D = S.days[t] || (S.days[t] = { p:{}, done:0 });
  if (!D.p) D.p = {};
  return D;
}
function fl(D, k, en) { const m = D.p[k] || (D.p[k] = {}); return m[en] || (m[en] = [0,0,0,0,0]); }
const stepsOk = f => f.every(x => x);
function langDone(k) { const D = getDay(); return todayQueue().every(e => stepsOk(fl(D, k, e.en))); }
function curEntry(k) { const D = getDay(); return todayQueue().find(e => !stepsOk(fl(D, k, e.en))) || null; }
function markStep(k, en, i) { const D = getDay(), f = fl(D, k, en); if (!f[i]) { f[i] = 1; S.xp += 5; save(); } }
// Move to the first language that is not finished yet (used on load).
function autoLang() {
  if (langDone(LG[cur.lg].k)) { const nx = LG.findIndex(g => !langDone(g.k)); if (nx >= 0) cur.lg = nx; }
}
// After a step: if the language is finished, switch automatically to the next one.
function afterStep(k, msg) {
  if (LG.every(g => langDone(g.k))) {
    if (!getDay().done) setTimeout(completeDay, 600);
    pendingMsg = '🏆 आजचे सर्व शब्द तिन्ही भाषांमध्ये पूर्ण!';
    render(); return;
  }
  if (langDone(k)) {
    const nx = LG.findIndex(g => !langDone(g.k));
    pendingMsg = LG.find(g => g.k === k).n + ' पूर्ण! आता ' + LG[nx].n + 'मध्ये जाऊया';
    render();
    setTimeout(() => { cur.lg = nx; render(); }, 1400);
    return;
  }
  pendingMsg = msg || '';
  render();
}
function passStep(i) {
  const k = LG[cur.lg].k, e = curEntry(k); if (!e) return;
  markStep(k, e.en, i); chime(); hop(); afterStep(k, '👏 शाबास!');
}

async function greet() {
  const el = $('avatar'), b = $('bubble'), r = el.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  const dx = W / 2 - (r.left + r.width / 2), dy = H * .3 - (r.top + r.height / 2), sc = 2.4;
  const T = (x, y, s) => 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  const msg = 'नमस्कार ' + (S.name || '') + '! आज नवीन शब्द वाचूया!';
  const go = el.animate([{ transform: T(0, 0, 1) }, { transform: T(dx * .5, dy - 70, 1.7), offset: .35 }, { transform: T(dx, dy, sc), offset: .62 }, { transform: T(dx, dy - 26, sc), offset: .75 }, { transform: T(dx, dy, sc) }], { duration: 1300, easing: 'ease-out', fill: 'forwards' });
  el.style.zIndex = 50; await go.finished;
  b.style.top = (r.top + r.height / 2 + dy + (r.height * sc) / 2 + 20) + 'px'; b.textContent = msg; b.hidden = false;
  speakText(msg, 'mr-IN');
  await sleep(4000);
  b.hidden = true;
  const back = el.animate([{ transform: T(dx, dy, sc) }, { transform: T(dx * .4, dy * .4 - 30, 1.4), offset: .5 }, { transform: T(0, 0, 1) }], { duration: 900, easing: 'ease-in', fill: 'forwards' });
  await back.finished; go.cancel(); back.cancel(); el.style.zIndex = '';
}

/* ---------- Weapon celebration (guarded so taps don't overlap) ---------- */
let actBusy = false;
async function playWeaponAction() {
  if (actBusy) return; actBusy = true;
  try { await runWeaponAction(); } finally { actBusy = false; }
}
async function runWeaponAction() {
  const p = S.avatar.prop;
  const el = $('avatar'), r = el.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  const dx = W / 2 - (r.left + r.width / 2), dy = H * .32 - (r.top + r.height / 2), sc = 2.8;
  const T = (x, y, s) => 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  el.style.zIndex = 70;
  const jump = el.animate([
    { transform: T(0, 0, 1) },
    { transform: T(dx, dy - 40, sc), offset: 0.7 },
    { transform: T(dx, dy, sc) }
  ], { duration: 900, easing: 'ease-out', fill: 'forwards' });
  await jump.finished;
  if (p === 'sword') {
    drawAvatar('anim-slash'); playWeaponSound('sword');
    await sleep(400); playWeaponSound('sword');
    await sleep(400); playWeaponSound('sword');
  } else if (p === 'spear') {
    drawAvatar('anim-thrust'); playWeaponSound('spear');
    await sleep(350); playWeaponSound('spear');
    await sleep(350); playWeaponSound('spear');
  } else if (p === 'shield') {
    drawAvatar('anim-block'); playWeaponSound('shield');
    await sleep(500); playWeaponSound('shield');
  } else if (p === 'bow') {
    drawAvatar('anim-shoot'); playWeaponSound('bow');
    await sleep(400); playWeaponSound('bow');
    await sleep(400); playWeaponSound('bow');
  } else {
    drawAvatar(); hop();
  }
  await sleep(1400);
  drawAvatar();
  const back = el.animate([
    { transform: T(dx, dy, sc) },
    { transform: T(0, 0, 1) }
  ], { duration: 800, easing: 'ease-in', fill: 'forwards' });
  await back.finished;
  jump.cancel(); back.cancel();
  el.style.zIndex = '';
}

/* ---------- Speech synthesis ---------- */
let voices = [];
function loadVoices() { if (window.speechSynthesis) voices = speechSynthesis.getVoices() || []; }
function pickVoice(l) {
  const pre = l.slice(0, 2); let b = null;
  for (const v of voices) { const g = String(v.lang).replace('_', '-').toLowerCase(); if (g === l.toLowerCase()) return v; if (g.indexOf(pre) === 0 && !b) b = v; }
  return b || (pre === 'mr' ? pickVoice('hi-IN') : null);
}
function speakText(t, l, rate) {
  if (!window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t), v = pickVoice(l); u.lang = l; if (v) { u.voice = v; u.lang = v.lang; } u.rate = rate || .9; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) {}
}

  const r = rec = new SR(); r.lang = lang; r.interimResults = true; r.continuous = continuous; r.maxAlternatives = 3;
  r.onresult = e => { if (rec !== r) return; const all = []; for (let i = 0; i < e.results.length; i++) { const x = e.results[i]; all.push({ alts: Array.from(x).map(a => a.transcript), final: x.isFinal }); } onRes(all); };
  r.onerror = e => { if (rec !== r) return; const m = { 'not-allowed':'मायक्रोफोनची परवानगी नाही.', 'no-speech':'काहीही ऐकू आले नाही. पुन्हा प्रयत्न करा.', 'network':'इंटरनेट समस्या आहे.' }; onErr(m[e.error] || ('त्रुटी: ' + e.error)); };
  r.onend = () => { if (rec === r) { rec = null; onEnd(); } };
  try { r.start(); } catch (e) { rec = null; onErr('रेकॉर्डिंग सुरू होऊ शकले नाही.'); }
}
function stopRec() { if (rec) { const r = rec; rec = null; try { r.abort(); } catch (e) {} } }

// Lowercase, drop nukta and ZWJ/ZWNJ, map Devanagari digits, drop danda, strip punctuation.
function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/\u093c/g, '').normalize('NFC').replace(/[\u200c\u200d]/g, '')
    .replace(/[\u0966-\u096F]/g, d => String(d.charCodeAt(0) - 0x966)).replace(/\u0964/g, '').replace(/[.,!?;:"'()\-]/g, ' ').replace(/\s+/g, ' ').trim();
}
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, i) => i); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
const sim = (a, b) => { if (a === b) return 1; const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 0; };
const same = (a, b) => !!a && !!b && (a === b || (Math.min(a.length, b.length) > 3 && sim(a, b) >= .72));
function wordMatch(heard, target) {
  const t = norm(target), h = norm(heard); if (!h) return false;
  if (t.indexOf(' ') >= 0) return sim(h, t) >= .70 || h.indexOf(t) >= 0;
  return h.split(' ').some(x => same(x, t)) || same(h.replace(/ /g, ''), t);
}
function track(spoken, nw) {
  const m = new Array(nw.length).fill(0); let p = 0;
  for (const tk of spoken) for (let j = p; j < Math.min(p + 4, nw.length); j++) { if (same(tk, nw[j])) { for (let q = p; q < j; q++) if (!m[q]) m[q] = 2; m[j] = 1; p = j + 1; break; } }
  return { m, p };
}
function paintSent(tr, n) {
  for (let i = 0; i < n; i++) { const e = $('t' + i); if (e) e.className = 'w' + (tr.m[i] === 1 ? ' ok' : tr.m[i] === 2 ? ' skip' : i === tr.p ? ' cur' : ''); }
}

/* ---------- Step actions for the current word ---------- */
const fbSet = (id, t, c) => { const e = $(id); if (e) { e.textContent = t; e.className = 'fb ' + (c || ''); } };
function micState(w) {
  micOn = w || null;
  const a = $('micW'), b = $('micS');
  if (a) { a.classList.toggle('rec', micOn === 'W'); a.textContent = micOn === 'W' ? '🛑 थांबवा' : '🎤 शब्द बोला'; }
  if (b) { b.classList.toggle('rec', micOn === 'S'); b.textContent = micOn === 'S' ? '🛑 थांबवा' : '🎤 वाक्य वाचा'; }
}

// Step 0: read the word aloud
function micReadWord() {
  if (!SR) return noSR();
  if (micOn === 'W') { stopRec(); micState(); return; }
  const k = LG[cur.lg].k, e = curEntry(k); if (!e) return;
  let ok = false, err = '';
  micState('W'); fbSet('fb', 'ऐकत आहे...', '');
  startRec(LG[cur.lg].sr, false, all => {
    fbSet('fb', 'तुम्ही म्हणालात: ' + all.map(r => r.alts[0]).join(' '), '');
    if (!ok && all.some(r => r.alts.some(a => wordMatch(a, e[k])))) {
      ok = true; stopRec(); micState(); markStep(k, e.en, 0); chime(); afterStep(k, '👏 छान उच्चार!');
    }
  }, () => { micState(); if (!ok && !err) fbSet('fb', 'उच्चार जुळला नाही. पुन्हा प्रयत्न करा: "' + e[k] + '"', 'no'); },
  m => { err = m; micState(); fbSet('fb', m, 'no'); });
}

// Step 1: hear the word (marks the step when played)
function stepListen() {
  const k = LG[cur.lg].k, e = curEntry(k); if (!e) return;
  speakText(e[k], LG[cur.lg].sr, .85);
  markStep(k, e.en, 1); afterStep(k, '🔊 छान ऐकलेस!');
}

// Step 2: write the word
function stepWriteWord() {
  const k = LG[cur.lg].k, e = curEntry(k); if (!e) return;
  const v = norm($('inW').value), t = norm(e[k]);
  if (v && (v === t || (t.length > 3 && sim(v, t) >= .85))) { markStep(k, e.en, 2); chime(); afterStep(k, '✍️ बरोबर लिहिलेस!'); }
  else fbSet('fb', 'पुन्हा प्रयत्न करा. शब्द नीट पाहा.', 'no');
}

// Step 3: write a sentence that uses the word
function stepWriteSent() {
  const k = LG[cur.lg].k, e = curEntry(k); if (!e) return;
  const v = norm($('inS').value), t = norm(e[k]);
  const minW = k === 'en' ? 3 : 2;
  if (v.indexOf(t) >= 0 && v.split(' ').filter(Boolean).length >= minW) { markStep(k, e.en, 3); chime(); afterStep(k, '✍️ छान वाक्य!'); }
  else fbSet('fb', 'वाक्यात "' + e[k] + '" हा शब्द असायला हवा, आणि किमान ' + minW + ' शब्द लिहा.', 'no');
}
function showModel() { const k = LG[cur.lg].k, e = curEntry(k); if (e) $('model').textContent = 'नमुना: ' + e.s[k]; }

// Step 4: hear and read the sentence
function stepSaySent() { const k = LG[cur.lg].k, e = curEntry(k); if (e) speakText(e.s[k], LG[cur.lg].sr, .85); }
function micReadSent() {
  if (!SR) return noSR();
  const k = LG[cur.lg].k, e = curEntry(k); if (!e) return;
  const nw = e.s[k].split(/\s+/).map(norm), n = nw.length;
  if (micOn === 'S') { stopRec(); micState(); evalSent(lastTr || { m: [], p: 0 }, n, e, k); return; }
  let ok = false, err = ''; lastTr = { m: new Array(n).fill(0), p: 0 };
  paintSent(lastTr, n); micState('S'); fbSet('fb', 'सुरू आहे... हळू आणि स्पष्ट वाचा', '');
  startRec(LG[cur.lg].sr, true, all => {
    lastTr = track(norm(all.map(r => r.alts[0]).join(' ')).split(' ').filter(Boolean), nw);
    paintSent(lastTr, n);
    if (!ok && lastTr.p >= n) { ok = true; stopRec(); micState(); evalSent(lastTr, n, e, k); }
  }, () => { micState(); if (!ok && !err) { ok = true; evalSent(lastTr, n, e, k); } },
  m => { err = m; micState(); fbSet('fb', m, 'no'); });
}
function evalSent(tr, n, e, k) {
  const good = tr.m.filter(x => x === 1).length;
  if (good / n >= .7) { markStep(k, e.en, 4); chime(); afterStep(k, '👏 वाक्य छान वाचलेस!'); }
  else { paintSent(tr, n); fbSet('fb', 'चांगले प्रयत्न! ' + good + '/' + n + ' शब्द बरोबर. पुन्हा वाचा.', 'no'); }
}

/* ---------- Rendering ---------- */
function wordCard(e, k, Q, D) {
  const L = LG[cur.lg], f = fl(D, k, e.en), idx = Q.indexOf(e) + 1;
  const others = LG.filter(g => g.k !== k).map(g => g.n + ': <b>' + esc(e[g.k]) + '</b>').join(' · ');
  const step = (i, body) => '<div class="step' + (f[i] ? ' done' : '') + '"><div class="lang">' + (i + 1) + '. ' + STEPS[i] + (f[i] ? '<span class="tick">✔</span>' : '') + '</div>' + (f[i] ? '' : body) + '</div>';
  const s = e.s[k];
  let h = '<div class="card"><div class="lang">' + L.n + ' · शब्द ' + idx + '/' + Q.length + '</div><div class="big">' + esc(e[k]) + '</div><div class="meaning">इतर भाषा: ' + others + '</div>';
  h += step(0, '<div class="row"><button class="btn mic" id="micW" onclick="micReadWord()">🎤 शब्द बोला</button>' + (SR ? '' : '<button class="btn w" onclick="passStep(0)">पास करा</button>') + '</div>');
  h += step(1, '<div class="row"><button class="btn b" onclick="stepListen()">🔊 ऐका</button></div>');
  h += step(2, '<div class="row"><input id="inW" placeholder="शब्द लिहा" autocomplete="off"><button class="btn g" onclick="stepWriteWord()">तपासा</button></div>');
  h += step(3, '<div class="meaning">"' + esc(e[k]) + '" हा शब्द वापरून एक वाक्य लिहा.</div><div class="row"><textarea id="inS" placeholder="वाक्य लिहा"></textarea></div><div class="row"><button class="btn g" onclick="stepWriteSent()">तपासा</button><button class="btn w" onclick="showModel()">नमुना पहा</button></div><div id="model" class="hint"></div>');
  h += step(4, '<div class="sent" id="sentBox">' + s.split(/\s+/).map((t, i) => '<span class="w" id="t' + i + '">' + esc(t) + '</span>').join(' ') + '</div><div class="row"><button class="btn b" onclick="stepSaySent()">🔊 ऐका</button><button class="btn mic" id="micS" onclick="micReadSent()"' + (SR ? '' : ' disabled') + '>🎤 वाक्य वाचा</button>' + (SR ? '' : '<button class="btn w" onclick="passStep(4)">पास करा</button>') + '</div>');
  h += '<div id="fb" class="fb"></div></div>';
  return h;
}

function render() {
  stopRec(); micOn = null;
  const msg = pendingMsg; pendingMsg = '';
  const D = getDay(), Q = todayQueue(), k = LG[cur.lg].k, e = curEntry(k);
  let h = '<div class="card" style="text-align:center"><b>🌟 दिवस ' + dayNo() + '</b> &nbsp; ' + (D.done ? '🎉 आजचे काम पूर्ण!' : '') +
    '<div class="meaning" style="margin-top:8px">' + LG.map(g => g.n + ': ' + Q.filter(x => stepsOk(fl(D, g.k, x.en))).length + '/' + Q.length).join(' · ') + '</div></div>';
  h += '<div class="tabs">' + LG.map((g, i) => '<button class="tab' + (cur.lg === i ? ' on' : '') + (langDone(g.k) ? ' dn' : '') + '" onclick="switchLang(' + i + ')">' + g.n + (langDone(g.k) ? ' ✔' : '') + '</button>').join('') + '</div>';
  if (!SR) h += '<div class="warn">⚠️ हा ब्राउझर बोलून ओळखणे सपोर्ट करत नाही. Chrome वापरा, किंवा ‘पास’ बटण वापरा.</div>';
  if (msg) h += '<div class="card pass" style="font-weight:700;text-align:center">' + msg + '</div>';
  if (!e) h += '<div class="card" style="text-align:center">✅ ' + LG[cur.lg].n + ' मधील आजचे सर्व शब्द पूर्ण झाले.</div>';
  else h += wordCard(e, k, Q, D);
  h += '<div class="row"><button class="btn w" onclick="openPicker(false)">📚 शब्द निवडा</button><button class="btn w" onclick="openInv()">👕 अवतार</button><button class="btn w" onclick="openSettings()">⚙️ सेटिंग्ज</button><button class="btn w" onclick="greet()">👋 शुभेच्छा</button></div>';
  $('app').innerHTML = h; updStats();
}
function updStats() { $('sx').textContent = '⭐ ' + S.xp; $('ss').textContent = '🔥 ' + S.streak; }

function completeDay() {
  const D = getDay(), t = today(); if (D.done) return;
  D.done = 1; S.xp += 50;
  S.streak = S.last === addDays(t, -1) ? S.streak + 1 : (S.last === t ? S.streak : 1); S.last = t; if (S.streak > S.best) S.best = S.streak;
  todayQueue().forEach(e => { if (S.completed.indexOf(e.en) < 0) S.completed.push(e.en); });
  save(); render(); celebrate();
}

/* ---------- Sound and confetti ---------- */
let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} return AC; }
function tone(f, t0, d, type, g) { const a = ac(); if (!a) return; const o = a.createOscillator(), n = a.createGain(), t = a.currentTime + t0; o.type = type || 'triangle'; o.frequency.value = f; n.gain.setValueAtTime(.0001, t); n.gain.exponentialRampToValueAtTime(g || .22, t + .02); n.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(n); n.connect(a.destination); o.start(t); o.stop(t + d + .05); }
const chime = () => { tone(660, 0, .16); tone(880, .14, .28); };
const fanfare = () => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .16, .28, 'square', .14)); tone(1568, 1.2, .9, 'triangle', .2); };
function playWeaponSound(type) {
  const a = ac(); if (!a) return;
  if (type === 'sword') { tone(900, 0, 0.15, 'sine', 0.3); tone(400, 0.05, 0.2, 'triangle', 0.25); }
  else if (type === 'spear') { tone(220, 0, 0.25, 'sawtooth', 0.3); tone(600, 0.08, 0.15, 'sine', 0.2); }
  else if (type === 'shield') { tone(450, 0, 0.3, 'square', 0.2); tone(300, 0.05, 0.4, 'triangle', 0.25); }
  else if (type === 'bow') { tone(350, 0, 0.08, 'sawtooth', 0.25); tone(850, 0.06, 0.25, 'sine', 0.3); }
}
let cfOn = 0, parts = [], endAt = 0, bt = 0;
const COL = ['#FFC93C', '#FF5D5D', '#2BB673', '#5C7CFF', '#FF7AC6', '#ffffff'], rcol = () => COL[Math.floor(Math.random() * COL.length)];
async function celebrate() {
  const c = $('cf'); c.width = innerWidth; c.height = innerHeight; parts = []; cfOn = 1; endAt = Date.now() + 6500; bt = 0;
  const old = $('bn'); if (old) old.remove();
  fanfare(); loop();
  await playWeaponAction();
  const weaponName = (ITEMS.prop.find(x => x[0] === S.avatar.prop) || [])[1] || '';
  const b = document.createElement('div'); b.className = 'banner'; b.id = 'bn';
  b.innerHTML = '🎉 शाबास ' + esc(S.name || '') + '!<br>आजचा दिवस पूर्ण झाला!<br><div style="font-size:18px;color:#D84315;margin:8px 0">तुझे शस्त्र: ' + weaponName + ' 🏆</div><div style="font-size:17px;margin:8px 0">+50 XP &nbsp;·&nbsp; सलग ' + S.streak + ' दिवस 🔥</div><button class="btn g" onclick="this.parentNode.remove();openInv()">अवतार बदला</button> <button class="btn w" onclick="this.parentNode.remove()">बंद करा</button>';
  document.body.appendChild(b);
}
function burst(x, y) { const c = rcol(); for (let i = 0; i < 40; i++) { const a = 6.283 * i / 40, v = 2 + Math.random() * 4; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 55 + Math.random() * 30, c, s: 3, g: .07 }); } }
function loop() {
  const c = $('cf'), x = c.getContext('2d'), now = Date.now(); x.clearRect(0, 0, c.width, c.height);
  if (cfOn && now < endAt) { if (now - bt > 450) { bt = now; burst(c.width * (.1 + Math.random() * .8), c.height * (.1 + Math.random() * .4)); } parts.push({ x: Math.random() * c.width, y: -10, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 2, l: 240, c: rcol(), s: 8, g: 0 }); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.l--; if (p.l <= 0 || p.y > c.height + 20) { parts.splice(i, 1); continue; } x.fillStyle = p.c; x.fillRect(p.x, p.y, p.s, p.s); }
  if ((cfOn && now < endAt) || parts.length) requestAnimationFrame(loop); else cfOn = 0;
}

/* ---------- Settings ---------- */
function openSettings(first) {
  const cl = { off:'क्लाउड बॅकअप बंद (Firebase सेट केलेले नाही)', ok:'क्लाउडवर सेव्ह झाले', sync:'सिंक होत आहे...', err:'क्लाउड सिंक अयशस्वी' }[cloud];
  $('sheet').innerHTML = '<b style="font-size:20px">⚙️ सेटिंग्ज</b>' + (first ? '<div class="warn">स्वागत आहे! आधी तुमचे नाव व इयत्ता निवडा.</div>' : '') +
    '<div class="lang" style="margin-top:8px">नाव</div><input id="sn" value="' + esc(S.name) + '" placeholder="मुलाचे नाव">' +
    '<div class="lang" style="margin-top:8px">इयत्ता</div><select id="sc2">' + Array.from({ length: 10 }, (_, i) => '<option value="' + (i + 1) + '"' + (+S.cls === i + 1 ? ' selected' : '') + '>इयत्ता ' + (i + 1) + '</option>').join('') + '</select>' +
    '<button class="btn g" style="width:100%;margin-top:8px" onclick="saveSettings()">💾 जतन करा</button><hr><div class="fb">' + cl + '</div>' +
    '<div class="row"><button class="btn b" onclick="fbGoogle()">Google ने लॉगिन</button><button class="btn w" onclick="fbPush()">आता सिंक करा</button></div>' +
    '<div class="row"><button class="btn r" onclick="resetAll()">सर्व डेटा रीसेट</button><button class="btn w" onclick="closeModal()">बंद करा</button></div>';
  $('modal').hidden = false;
}
function saveSettings() { S.name = $('sn').value.trim() || ''; S.cls = +$('sc2').value; const first = !S.setup; S.setup = true; save(); closeModal(); if (first) setTimeout(greet, 400); }
function resetAll() { if (confirm('सर्व प्रगती पुसायची आहे का?')) { localStorage.removeItem(KEY); load(); save(); drawAvatar(); closeModal(); } }

/* ---------- Firebase cloud backup (optional) ---------- */
function setCloud(c) { cloud = c; $('cl').textContent = { off:'○', ok:'☁️', sync:'⏳', err:'⚠️' }[c]; }
function scheduleSync() { if (!fb || !fb.uid) return; clearTimeout(syncT); syncT = setTimeout(fbPush, 1500); }
async function fbInit() {
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') { setCloud('off'); return; }
  try {
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VERSION + '/';
    const [A, F, U] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = A.initializeApp(firebaseConfig), auth = U.getAuth(app); let db;
    try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch (e) { db = F.getFirestore(app); }
    fb = { auth, db, doc: F.doc, getDoc: F.getDoc, setDoc: F.setDoc, U, uid: null };
    await new Promise(res => U.onAuthStateChanged(auth, u => { if (u) { fb.uid = u.uid; res(); } else U.signInAnonymously(auth).catch(res); }));
    if (!fb.uid) { setCloud('err'); return; }
    await fbPull(); setCloud('ok'); drawAvatar(); autoLang(); render();
  } catch (e) { setCloud('err'); }
}
async function fbPush() {
  if (!fb || !fb.uid) return;
  try { setCloud('sync'); await fb.setDoc(fb.doc(fb.db, 'children', fb.uid), { data: JSON.stringify(S), updatedAt: S.updatedAt, name: S.name || '', streak: S.streak, xp: S.xp }, { merge: true }); setCloud('ok'); }
  catch (e) { setCloud('err'); }
}
async function fbPull() {
  const snap = await fb.getDoc(fb.doc(fb.db, 'children', fb.uid));
  if (snap.exists()) {
    let rs = null; try { rs = JSON.parse(snap.data().data); } catch (e) {}
    // Take the cloud copy only if it is at least as new as local data.
    if (rs && (+rs.updatedAt || 0) >= (S.updatedAt || 0)) {
      S = Object.assign({}, S, rs);
      S.avatar = Object.assign({}, defAv, S.avatar);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    }
  }
}
async function fbGoogle() {
  if (!fb) { alert('Firebase config भरलेले नाही.'); return; }
  try { const r = await fb.U.signInWithPopup(fb.auth, new fb.U.GoogleAuthProvider()); fb.uid = r.user.uid; await fbPull(); setCloud('ok'); drawAvatar(); autoLang(); render(); closeModal(); }
  catch (e) { alert('Google लॉगिन अयशस्वी: ' + e.message); }
}

/* ---------- Start ---------- */
load(); autoLang(); drawAvatar(); render(); loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
$('avatar').onclick = openInv;
$('modal').onclick = e => { if (e.target === $('modal')) closeModal(); };
document.addEventListener('touchstart', ac, { once: true });
fbInit();
if (!S.setup) openSettings(true); else window.addEventListener('load', () => setTimeout(greet, 500));
</script>
