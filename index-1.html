function imgPage(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);LSpt.push('');ok(shrink(c))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function upLesson(f){const fl=Array.from(f.files);if(!fl.length)return;$('lst').textContent='⏳ तयार होत आहे...';let pages=[];LShi=[];LSpt=[];
 try{for(const file of fl)pages=pages.concat(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)?await pdfPages(file):[await imgPage(file)])}
 catch(e){$('lst').textContent='❌ PDF वाचता आला नाही (इंटरनेट हवं). पुस्तकाचे फोटो निवडून पाहा.';return}
 LSdraft=pages.slice(0,8);LShi=LShi.slice(0,8);LSpt=LSpt.slice(0,8);$('lpv').innerHTML=LSdraft.map(p=>`<img class="pic" style="max-height:140px" src="${p}" alt="">`).join('');$('lst').textContent='✅ '+LSdraft.length+' पाने तयार — खाली 📝 बटण दाबून मजकूर काढा, मग Save दाबा'}

function lineText(items){const rows=[];items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]/3),x=it.transform[4];let r=rows.find(q=>Math.abs(q.y-y)<=1);if(!r){r={y,a:[]};rows.push(r)}r.a.push([x,it.str])});
 rows.sort((a,b)=>b.y-a.y);return rows.map(r=>r.a.sort((p,q)=>p[0]-q[0]).map(z=>z[1]).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n')}
function tidyLines(t){const out=[];t.split('\n').forEach(l=>{l=l.trim();if(!l)return;const p=out[out.length-1];if(p&&(/[,\-–]$/.test(p)||(/^[a-z(]/.test(l)&&!/[.?!:।]$/.test(p))))out[out.length-1]=p+' '+l;else out.push(l)});
 return out.map(l=>l.replace(/([.?!।])\s+/g,(m,q,o,str)=>q==='.'&&/[0-9०-९]/.test(str.charAt(o-1))?m:q+'\n')).join('\n')}
function tidyOCR(t){return t.replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.split('\n').map(x=>x.trim()).filter(Boolean).join(' ')).filter(Boolean)
 .map(p=>p.replace(/\s*\|\s*/g,'। ').replace(/\s{2,}/g,' ').replace(/([.?!।])\s+/g,(m,q,o,str)=>q==='.'&&/[0-9०-९]/.test(str.charAt(o-1))?m:q+'\n').trim()).join('\n')}
async function runOCR(){const st=$('ocst');
 if(LSpt.filter(x=>x.length>60).length>=Math.max(1,Math.ceil(LSpt.length/2))){$('aln').value=tidyLines(LSpt.join('\n'));st.textContent='✅ PDF मधला मजकूर थेट घेतला (OCR ची गरज नाही) — तपासा, मग Save दाबा';return}if(!LShi.length){st.textContent='⚠ मजकूर काढण्यासाठी PDF/फोटो पुन्हा निवडा (सेव केलेली पाने कमी दर्जाची असतात).';return}
 const code={hi:'hin+eng',mr:'mar+eng',en:'eng'}[$('alg').value];st.textContent='⏳ OCR सुरू... (पहिल्यांदा भाषा-फाईल डाउनलोड होईल, थोडा वेळ लागेल)';
 try{if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  let pn=0;const w=await Tesseract.createWorker(code,1,{logger:m=>{if(m.status==='recognizing text')st.textContent='⏳ पान '+(pn+1)+' / '+LShi.length+' — '+Math.round(m.progress*100)+'%'}}),out=[];
  for(pn=0;pn<LShi.length;pn++){const r=await w.recognize(LShi[pn]);out.push(r.data.text)}
  await w.terminate();$('aln').value=tidyOCR(out.join('\n\n'));st.textContent='✅ मजकूर तयार — नीट तपासा, चुका दुरुस्त करा, मग Save दाबा'}
 catch(e){st.textContent='❌ OCR झालं नाही (इंटरनेट हवं). मजकूर हाताने टाका किंवा पुन्हा प्रयत्न करा.'}}
function delLesson(){delete LS[adDate];saveL();renderAdmin()}
function saveA(){const e=$('aw0').value.trim(),m=$('aw1').value.trim(),h=$('aw2').value.trim();
 const a0=$('as0').value.trim(),a1=$('as1').value.trim(),a2=$('as2').value.trim(),sw=sugW(adDate),sg=sugS(adDate)||{en:'',mr:'',hi:''};
 if(e&&m&&h&&(e!==sw.en||m!==sw.mr||h!==sw.hi||a0!==sg.en||a1!==sg.mr||a2!==sg.hi)){S.wd[adDate]={en:e,mr:m,hi:h};if(a0&&a1&&a2)S.sd[adDate]={en:a0,mr:a1,hi:a2};else delete S.sd[adDate]}else{delete S.wd[adDate];delete S.sd[adDate]}
 save();
 const old=LS[adDate],pages=LSdraft||(old?old.p:[]),n=$('aln').value;
 if(pages.length||n.trim()){LS[adDate]={t:$('alt').value.trim(),n,p:pages,lg:$('alg').value};const ks=Object.keys(LS).sort();while(ks.length>3)delete LS[ks.shift()];if(!saveL())return}else delete LS[adDate],saveL();
 $('amsg').innerHTML='<span class="ok">✅ Saved '+adDate+'</span>'+(LS[adDate]?'<br><button class="btn g big" onclick="goStudent(\'lesson\')">👦 आत्ताच मुलाच्या ॲपमध्ये धडा पाहा आणि ऐका</button><div class="hint">'+(adDate===today()?'हा धडा आजच्या प्लॅनमध्ये दिसेल.':'हा धडा '+adDate+' चा आहे; मुलाच्या Home वर "📚" यादीत दिसेल.')+'</div>':'');$('aprog').innerHTML=adminProg()}
function adminProg(){const keys=Object.keys(S.days).sort().reverse();
 return `<div class="card"><h2>📊 Ronak progress</h2>🔥 Streak: ${S.streak} | Best: ${S.best} | ⭐ ${S.pts}<br>Days completed: ${doneCount()} / 50<table><tr><th>Date</th><th>Day</th><th>शब्द</th><th>धडा</th><th>Done</th><th>OK</th></tr>${keys.slice(0,14).map(k=>{const p=S.days[k];return `<tr><td>${k}</td><td>${dayNo(k)}</td><td>${Object.keys(p.w).length}/3</td><td>${LS[k]?(p.l?'✔':'—'):'n/a'}</td><td>${p.done?'✅':'⏳'}</td><td>${p.ok?'⭐':'—'}</td></tr>`}).join('')}</table>
 <button class="btn b big" onclick="report()">📄 PDF अहवाल तयार करा (Save as PDF)</button></div>
 <div class="card"><h3>⚙ Settings &amp; backup</h3>Start date (Day 1)<input type="date" value="${S.start}" onchange="S.start=this.value;save()"><div id="vsw">${voiceUI()}</div>
 <button class="btn b" onclick="$('bk').value=JSON.stringify(S)">Export</button><button class="btn b" onclick="impJ()">Import</button><button class="btn r" onclick="rstP()">Reset progress</button><textarea id="bk" rows="3" placeholder="Backup JSON"></textarea></div>`}
function impJ(){try{const r=JSON.parse($('bk').value);if(r&&r.v===2&&r.days){S=r;if(!S.vc)S.vc={n:'',p:1.3};if(!S.cal)S.cal={};if(!S.sd)S.sd={};if(!S.pf)S.pf={n:'रोनक',age:11,cls:6,bd:'महाराष्ट्र राज्य मंडळ',g:'m'};if(S.vc.v!==2){S.vc.v=2;S.vc.p=S.pf.g==='f'?1.15:1.3}save();adDate='';render()}else alert('Invalid backup')}catch(e){alert('Invalid backup')}}
function rstP(){if(confirm('Reset all progress? / प्रगती पुसायची?')){S.days={};S.pts=0;S.streak=0;S.best=0;S.last='';save();render()}}

let adFlash='';
function saveP(){const n=$('pn').value.trim();if(!n){alert('नाव लिहा / Enter name');return}
 let age=parseInt($('pa').value,10);if(!(age>=3&&age<=18))age=11;
 const g=$('pg').value,old=S.pf.g;S.pf={n,age,cls:+$('pc').value,bd:$('pb').value,g};if(g!==old)S.vc.p=g==='f'?1.15:1.3;save();
 adFlash='✅ '+n+' ची माहिती Save झाली — वय '+age+', इयत्ता '+S.pf.cls+', '+S.pf.bd;render()}
/* ---------- PDF report (print → Save as PDF) ---------- */
function report(){const keys=Object.keys(S.days).sort();let ok=0,rows='',tw=0,tl=0;
 keys.forEach(k=>{const d=S.days[k],w=wordFor(k),n=Object.keys(d.w).length;tw+=n;tl+=d.l?1:0;if(d.ok)ok++;
  rows+=`<tr><td>${k}</td><td>${dayNo(k)}</td><td>${esc(w.en)} / ${esc(w.mr)} / ${esc(w.hi)}</td><td>${n}/3</td><td>${LS[k]?(d.l?'✔':'—'):'—'}</td><td>${d.done?'✅':'⏳'}</td><td>${d.ok?'⭐':''}</td></tr>`});
 $('rpt').innerHTML=`<h1>${esc(S.pf.n)} — सराव अहवाल / Practice Report</h1><p>वय ${S.pf.age} · इयत्ता ${S.pf.cls} · ${esc(S.pf.bd)}</p><p>अहवालाची तारीख: ${today()} &nbsp;|&nbsp; सुरुवात: ${S.start}</p>
 <p><b>पूर्ण दिवस:</b> ${doneCount()} / 50 &nbsp; <b>Streak:</b> ${S.streak} (best ${S.best}) &nbsp; <b>Points:</b> ${S.pts} &nbsp; <b>तपासलेले दिवस:</b> ${ok}</p>
 <p><b>एकूण:</b> वहीत लिहिलेले शब्द ${tw} &nbsp; धडे ${tl}</p>
 <table><tr><th>तारीख</th><th>Day</th><th>शब्द (EN / मराठी / हिंदी)</th><th>लिहिले</th><th>धडा</th><th>पूर्ण</th><th>तपासले</th></tr>${rows||'<tr><td colspan="7">अजून सराव नाही</td></tr>'}</table>`;
 window.print()}

window.addEventListener('orientationchange',()=>setTimeout(()=>{if(S.role!=='admin'&&tab==='word')renderStudent()},400));
document.addEventListener('touchstart',ac,{once:true});
load();if(hasTTS()){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}render();
